# Render Blueprint for the Zayn Furnishings API.
#
# IMPORTANT: A Render service's region cannot be changed after the service is
# created. If you ever need a different region, create new services instead.
#
# PORT is injected by Render for web services. Do not set it here.
# Secret values are declared by name only (`sync: false`) and are entered in
# the Render Dashboard during the first Blueprint sync.

services:
  - type: web
    name: zayn-api-staging
    runtime: node
    region: ohio
    plan: starter
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @zayn/shared build && pnpm --filter @zayn/api build
    startCommand: pnpm --filter @zayn/api start
    envVars:
      # Pinned to the Node version used for local development.
      - key: NODE_VERSION
        value: "24.15.0"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: STOREFRONT_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false

