# LEGACY: this Render layout has no database now that Supabase is removed. The
# target deployment is Docker on a VPS (see docs/SUPABASE_REMOVAL_PLAN.md phases
# 8-12). Kept only as a reference.
#
# Reference only. Not read by Render. Copy into render.yaml (or create the service by hand) when the client's production account is ready, after creating the production branch.
#
# Keep this definition consistent with the staging service in render.yaml:
# same environment variable names, build command, and start command.

services:
  - type: web
    name: zayn-api-production
    runtime: node
    region: ohio
    plan: starter
    branch: production
    autoDeployTrigger: commit
    healthCheckPath: /health
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @zayn/shared build && pnpm --filter @zayn/api build
    startCommand: pnpm --filter @zayn/api start
    envVars:
      # Pinned to the Node version used for local development.
      - key: NODE_VERSION
        value: "24.15.0"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MEDIA_DIR
        sync: false
      - key: MEDIA_PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_AUTH_SECRET
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: STOREFRONT_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
