name: zayn

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - stack

  migrate:
    image: zayn-api:stack
    command: ["node", "dist/scripts/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL: disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging
    networks:
      - stack

  api:
    image: zayn-api:stack
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file:
      - ${COMPOSE_ENV_FILE:-.env.compose}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL: disable
      MEDIA_DIR: /data/media
    volumes:
      - media:/data/media
    expose:
      - "4000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging: *logging
    networks:
      - stack

  web:
    image: zayn-web:stack
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV}
        API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_INTERNAL_URL: http://api:4000
      STOREFRONT_API_KEY: ${STOREFRONT_API_KEY}
      APPLE_PAY_DOMAIN_ASSOCIATION: ${APPLE_PAY_DOMAIN_ASSOCIATION:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    expose:
      - "3000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      # Next runtime caches. They are safe to lose on restart: pages
      # regenerate from the API/DB and images are optimized again on demand.
      # route-cache is where Cache Components writes regenerated prerenders.
      - "/app/apps/web/.next/cache:uid=1001,gid=1001,mode=0700,size=128m"
      - "/app/apps/web/.next/server/route-cache:uid=1001,gid=1001,mode=0700,size=128m"
    logging: *logging
    networks:
      - stack

  edge:
    image: caddy:2.11.9
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EDGE_HOST_PORT:-8080}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-300}
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/admin/login"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *logging
    networks:
      - stack

  # One-shot encrypted backup of PostgreSQL and the media volume. It is behind
  # the "backup" profile so it never starts with the stack. Run it with
  # `pnpm docker:backup:run` or `docker compose --profile backup run --rm backup`.
  # It joins the stack network only to reach PostgreSQL; it publishes no ports.
  backup:
    image: zayn-backup:stack
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    profiles: ["backup"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/repo}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      # Stable restic host so retention groups snapshots across one-shot runs.
      RESTIC_HOST: ${RESTIC_HOST:-zayn-stack}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_READ_DATA_SUBSET: ${BACKUP_READ_DATA_SUBSET:-}
      HEALTHCHECK_PING_URL: ${HEALTHCHECK_PING_URL:-}
      BACKUP_STATUS_FILE: /status/last-backup.json
      RESTIC_CACHE_DIR: /scratch/restic-cache
      TMPDIR: /scratch/tmp
      TZ: UTC
    volumes:
      # Media is read-only: a backup must never mutate the live volume.
      - media:/data/media:ro
      # The default local repository is a Docker volume, not an off-server copy.
      - backup-repo:/repo
      - backup-status:/status
    tmpfs:
      - "/scratch:uid=1001,gid=1001,mode=0700,size=1g"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging: *logging
    networks:
      - stack

  # Named tunnel. TUNNEL_TOKEN is required and is read from the environment so
  # it never appears on the cloudflared command line or in logs.
  tunnel-token-check:
    image: alpine:3.20
    profiles: ["tunnel"]
    restart: "no"
    command:
      - sh
      - -ec
      - |
        test -n "$$TUNNEL_TOKEN" || {
          echo "TUNNEL_TOKEN is required for the tunnel profile. Set it in .env.compose; its value is never printed." >&2
          exit 1
        }
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging
    networks:
      - stack

  tunnel:
    image: cloudflare/cloudflared:2026.11.2
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      # auto, 4, or 6. Useful on an IPv6-only VPS (unverified).
      TUNNEL_EDGE_IP_VERSION: ${TUNNEL_EDGE_IP_VERSION:-auto}
    depends_on:
      tunnel-token-check:
        condition: service_completed_successfully
      edge:
        condition: service_healthy
    # cloudflared 2026.11.2 has `tunnel ready`, which queries the metrics
    # server's /ready endpoint and exits non-zero until the tunnel is ready.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging: *logging
    networks:
      - stack

  # TESTING ONLY: no account, no token, ephemeral trycloudflare.com URL.
  quicktunnel:
    image: cloudflare/cloudflared:2026.11.2
    profiles: ["quicktunnel"]
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 127.0.0.1:2000
      - --url
      - http://edge:80
    environment:
      TUNNEL_EDGE_IP_VERSION: ${TUNNEL_EDGE_IP_VERSION:-auto}
    depends_on:
      edge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging: *logging
    networks:
      - stack

volumes:
  pgdata:
  media:
  # Development-only local restic repository. It is NOT an off-server backup.
  backup-repo:
  # Small JSON status file written after a successful backup.
  backup-status:

networks:
  stack:
